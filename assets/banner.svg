<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Awesome Workforce Planning Platforms banner - curated SaaS and open-source tools for headcount planning, scenario modeling, organizational design, skills and capacity forecasting, and labor cost planning">
  <title>Awesome Workforce Planning Platforms</title>
  <desc>Animated banner for the Awesome Workforce Planning Platforms repository: a curated ecosystem of SaaS platforms and open-source GitHub projects for headcount planning, scenario modeling, org design, capacity forecasting, and labor cost planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#132246"/>
      <stop offset="1" stop-color="#0e1a38"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>
  </defs>

  <style>
    @keyframes hue { 0%,100% { stop-color:#38bdf8; } 50% { stop-color:#a78bfa; } }
    @keyframes grow { from { transform: scaleY(0.08); } to { transform: scaleY(1); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes sweep { 0% { transform: translateX(-620px); } 100% { transform: translateX(1220px); } }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.6s cubic-bezier(.22,.9,.35,1.1) both; }
    .node { animation: pulse 3.2s ease-in-out infinite; }
    .node2 { animation: pulse 4.4s ease-in-out infinite 1.1s; }
    .sweep { animation: sweep 5.5s linear infinite; }
    .title-grad stop { animation: hue 7s ease-in-out infinite; }
    .float { animation: drift 6s ease-in-out infinite; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- light sweep highlight -->
    <g class="sweep">
      <rect x="0" y="0" width="600" height="340" fill="url(#sweepGrad)" transform="rotate(6 600 170)"/>
    </g>

    <!-- org/network structure (left) -->
    <g stroke="#334155" stroke-width="2">
      <line x1="250" y1="100" x2="140" y2="62"/>
      <line x1="250" y1="100" x2="142" y2="182"/>
      <line x1="250" y1="100" x2="352" y2="64"/>
      <line x1="352" y1="64" x2="350" y2="152"/>
    </g>
    <g>
      <circle class="node" cx="140" cy="62" r="7" fill="#22d3ee"/>
      <circle class="node2" cx="142" cy="182" r="7" fill="#22d3ee"/>
      <circle class="node" cx="250" cy="100" r="11" fill="#818cf8"/>
      <circle class="node2" cx="352" cy="64" r="6" fill="#38bdf8"/>
      <circle class="node" cx="350" cy="152" r="6" fill="#38bdf8"/>
    </g>

    <!-- animated bar chart (right) -->
    <g>
      <rect x="782" y="288" width="40" height="70" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0s"/>
      <rect x="842" y="288" width="40" height="100" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0.18s"/>
      <rect x="902" y="288" width="40" height="80" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0.36s"/>
      <rect x="962" y="288" width="40" height="120" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0.54s"/>
      <rect x="1022" y="288" width="40" height="95" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0.72s"/>
      <rect x="1082" y="288" width="40" height="140" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:0.9s"/>
      <rect x="1142" y="288" width="40" height="110" rx="7" fill="url(#barGrad)" class="bar" style="animation-delay:1.08s"/>
      <line x1="775" y1="290" x2="1188" y2="290" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- headline -->
    <g class="float">
      <text x="70" y="112" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#7dd3fc">AWESOME WORKFORCE</text>
      <text class="title-grad" x="70" y="168" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">PLANNING PLATFORMS</text>
      <text x="70" y="212" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Ecosystem · SaaS &amp; Open-Source Tools</text>
      <text x="70" y="250" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">Headcount Planning • Scenario Modeling • Org Design • Capacity &amp; Labor Cost Planning</text>
    </g>

    <!-- footer -->
    <text x="70" y="314" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">★ Community-curated · Last updated August 2026</text>
    <text x="1130" y="314" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">github.com/ishandutta2007/Awesome-Workforce-Planning-Platform</text>
  </g>
</svg>
